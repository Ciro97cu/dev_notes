<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <!-- CSP: dipendenze self-hosted in ../assets/vendor/. blob: serve al lettore
       cifrato (i contenuti decifrati sono passati a docsify via blob URL). -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    img-src 'self' data:;
    connect-src 'self' blob:;
    worker-src 'self' blob:;
    child-src 'self' blob:;
    frame-src 'self';
  " />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <meta name="theme-color" content="#7b4f2a" />
  <title>·</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="../assets/vendor/vue.css" />
  <link rel="stylesheet" href="../assets/vendor/fonts.css" />
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    /* Cancello: schermata di sblocco davanti a docsify */
    #cv-gate{position:fixed;inset:0;z-index:2147483600;display:flex;align-items:center;justify-content:center;padding:1.2rem;background:var(--bg,#fff)}
    #cv-gate .cv-card{width:100%;max-width:420px;background:var(--bg-soft,#f6f8fa);border:1px solid var(--border,#e4e8ec);border-radius:16px;padding:1.8rem 1.6rem;text-align:center;box-shadow:var(--shadow-sm,0 2px 10px rgba(0,0,0,.08))}
    #cv-gate .cv-logo{color:var(--link,#7b4f2a);width:48px;height:48px;margin:0 auto .6rem}
    #cv-gate .cv-logo svg{width:100%;height:100%}
    #cv-gate h1{font-size:1.15rem;margin:.2rem 0 .15rem;color:var(--strong,#14181c)}
    #cv-gate p{color:var(--text-soft,#59636e);font-size:.9rem;margin:.2rem 0 1.1rem}
    #cv-gate .cv-row{display:flex;gap:.5rem}
    #cv-gate #cv-pass{flex:1;font:inherit;padding:.6rem .8rem;border:1px solid var(--border,#e4e8ec);border-radius:10px;background:var(--bg,#fff);color:var(--text,#1f2328)}
    #cv-gate #cv-pass:focus{outline:2px solid var(--link,#7b4f2a);outline-offset:1px}
    #cv-gate #cv-unlock{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--link,#7b4f2a);color:var(--on-accent,#fff);background:var(--link,#7b4f2a);border-radius:10px;padding:.6rem 1.15rem}
    #cv-gate .cv-err{color:#c0392b;font-size:.85rem;min-height:1.1em;margin-top:.7rem}
    html.dark #cv-gate .cv-err{color:#ff8f8f}
  </style>
</head>
<body>
  <!-- Ritorno all'hub Dev Notes (fuori da #app: docsify non lo intercetta) -->
  <a href="../" title="Torna a Dev Notes" aria-label="Torna a Dev Notes" style="position:fixed;right:16px;bottom:16px;z-index:2147483000;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#fff;color:#24292e;font-size:20px;line-height:1;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.22);border:1px solid rgba(0,0,0,.08)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></a>

  <!-- Cancello di sblocco -->
  <div id="cv-gate">
    <div class="cv-card">
      <div class="cv-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M12 3 3 8h18z"/><path d="M5 8v9"/><path d="M10 8v9"/><path d="M14 8v9"/><path d="M19 8v9"/></svg></div>
      <h1>Vault privato</h1>
      <p>Inserisci la passphrase per sbloccare.</p>
      <div class="cv-row">
        <input id="cv-pass" type="password" autocomplete="off" spellcheck="false" placeholder="passphrase" />
        <button id="cv-unlock" type="button">Sblocca</button>
      </div>
      <div id="cv-err" class="cv-err"></div>
    </div>
  </div>

  <!-- Mount di docsify: nascosto finché non si sblocca -->
  <div id="app" style="display:none">Caricamento…</div>

  <!-- Codice condiviso dell'hub + config del vault. Il core docsify NON è qui:
       lo inietta assets/gate.js dopo lo sblocco (contenuti già decifrati). -->
  <script src="../assets/shared/01-core.js"></script>
  <script src="../assets/shared/02-ui.js"></script>
  <script src="../assets/shared/03-search.js"></script>
  <script src="../assets/shared/04-plugins.js"></script>
  <script src="../assets/shared/05-study.js"></script>
  <script src="../assets/shared/06-highlighter.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/gate.js"></script>
</body>
</html>
