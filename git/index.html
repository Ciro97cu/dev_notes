<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Appunti Git</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Appunti di studio su Git, da zero ad avanzato">
  <meta name="theme-color" content="#f05133">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script>
    // Imposta il tema il prima possibile per evitare il flash bianco al caricamento.
    (function () {
      try {
        var saved = localStorage.getItem('dev-notes-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Ritorno all'hub Dev Notes (fuori da #app: docsify non lo intercetta) -->
  <a href="../" title="Torna a Dev Notes" aria-label="Torna a Dev Notes" style="position:fixed;right:16px;bottom:16px;z-index:2147483000;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#fff;color:#24292e;font-size:20px;line-height:1;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.22);border:1px solid rgba(0,0,0,.08)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></a>
  <div id="app">Caricamento…</div>
  <script>
    // Toggle tema chiaro/scuro, persistito in localStorage (key: dev-notes-theme).
    function themeTogglePlugin(hook) {
      hook.mounted(function () {
        var KEY = 'dev-notes-theme';
        var btn = document.createElement('button');
        btn.id = 'theme-toggle';
        btn.type = 'button';
        btn.setAttribute('aria-label', 'Cambia tema chiaro/scuro');
        var saved = localStorage.getItem(KEY);
        var dark = saved
          ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        function apply() {
          document.documentElement.classList.toggle('dark', dark);
          btn.textContent = dark ? '☀️' : '🌙';
          btn.title = dark ? 'Passa al tema chiaro' : 'Passa al tema scuro';
        }
        apply();
        btn.addEventListener('click', function () {
          dark = !dark;
          localStorage.setItem(KEY, dark ? 'dark' : 'light');
          apply();
        });
        document.body.appendChild(btn);
      });
    }

    window.$docsify = {
      name: 'Appunti Git',
      nameLink: '#/',
      loadSidebar: true,
      coverpage: true,
      onlyCover: false,
      homepage: 'README.md',
      notFoundPage: true,
      subMaxLevel: 2,
      relativePath: true,
      auto2top: true,
      search: {
        placeholder: 'Cerca…',
        noData: 'Nessun risultato',
        depth: 4
      },
      pagination: {
        previousText: 'Precedente',
        nextText: 'Successivo',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: 'Copia',
        errorText: 'Errore',
        successText: 'Copiato'
      },
      'flexible-alerts': {
        style: 'callout',
        note:    { label: 'Nota' },
        tip:     { label: 'Suggerimento' },
        warning: { label: 'Attenzione' },
        info:    { label: 'Info', className: 'note', icon: 'icon-note' }
      },
      plugins: [themeTogglePlugin]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
