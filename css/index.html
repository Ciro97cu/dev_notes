<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <!-- Content Security Policy: limita le origini esterne. Host SENZA schema
       (cdn.jsdelivr.net, fonts.*) così combacia sia in http (locale) sia in https
       (GitHub Pages). 'unsafe-inline'/'unsafe-eval' servono a docsify (e a Monaco dove
       c'è il playground); worker-src abilita i web worker di Monaco (data:/blob:/CDN). -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline' cdn.jsdelivr.net fonts.googleapis.com;
    font-src 'self' fonts.gstatic.com cdn.jsdelivr.net;
    img-src 'self' data: https:;
    worker-src 'self' blob: data: cdn.jsdelivr.net;
    child-src 'self' blob: data: cdn.jsdelivr.net;
    frame-src 'self';
    connect-src 'self' cdn.jsdelivr.net;
  " />
  <title>Appunti CSS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Appunti di studio su CSS — moderno (2026), da zero a Grid/animazioni">
  <meta name="theme-color" content="#1572b6">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <!-- Ritorno all'hub Dev Notes (fuori da #app: docsify non lo intercetta) -->
  <a href="../" title="Torna a Dev Notes" aria-label="Torna a Dev Notes" style="position:fixed;right:16px;bottom:16px;z-index:2147483000;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#fff;color:#24292e;font-size:20px;line-height:1;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.22);border:1px solid rgba(0,0,0,.08)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></a>
  <div id="app">Caricamento…</div>
  <script>
    // Risolve i link Obsidian [[nome]] / [[nome|alias]] in link Docsify (a render-time, i .md non vengono toccati).
    // Tutti i moduli stanno in /docs/, quindi [[NN-...]] -> /docs/NN-....md
    function wikilinkPlugin(hook) {
      hook.beforeEach(function (content) {
        // rimuove il frontmatter YAML (--- ... ---) così non viene stampato come testo
        content = content.replace(/^\s*---\n[\s\S]*?\n---\n/, '');
        return content.replace(/\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g, function (_, target, label) {
          target = target.trim();
          var anchor = '';
          var hashIdx = target.indexOf('#');
          if (hashIdx >= 0) { anchor = target.slice(hashIdx + 1).trim(); target = target.slice(0, hashIdx).trim(); }
          var text = (label || (anchor || target)).trim();
          var q = anchor ? '?id=' + anchor : '';
          var path = '/docs/' + target + '.md' + q;
          return '[' + text + '](' + path + ')';
        });
      });
    }

    // Renderizza i diagrammi mermaid dopo ogni cambio pagina
    function mermaidPlugin(hook) {
      hook.doneEach(function () {
        if (!window.mermaid) return;
        if (!window.__mermaidInit) {
          var darkNow = document.documentElement.classList.contains('dark');
          mermaid.initialize({ startOnLoad: false, theme: darkNow ? 'dark' : 'neutral' });
          window.__mermaidInit = true;
        }
        try { mermaid.run({ querySelector: '.markdown-section .mermaid' }); } catch (e) { /* già renderizzati */ }
      });
    }

    // Rende collassabili i callout "Risposta" (Obsidian [!success]- / [!success]+) anche sul sito.
    function collapsibleAnswersPlugin(hook) {
      hook.doneEach(function () {
        var callouts = document.querySelectorAll('.markdown-section .alert.callout-answer');
        callouts.forEach(function (el) {
          if (el.dataset.collapsibleReady) return;
          var heading = el.querySelector('p:first-child, .alert-heading, strong');
          if (!heading) return;
          var raw = (heading.textContent || '').trim();
          var startsCollapsed = true;
          if (/^[-+]/.test(raw)) {
            startsCollapsed = raw.charAt(0) === '-';
            heading.textContent = raw.replace(/^[-+]\s*/, '');
          }
          el.classList.add('is-collapsible');
          el.dataset.collapsibleReady = '1';
          var body = [];
          var n = heading.nextSibling;
          while (n) { body.push(n); n = n.nextSibling; }
          var wrap = document.createElement('div');
          wrap.className = 'answer-body';
          body.forEach(function (node) { wrap.appendChild(node); });
          el.appendChild(wrap);
          heading.classList.add('answer-toggle');
          heading.setAttribute('role', 'button');
          heading.setAttribute('tabindex', '0');
          function setState(open) {
            el.classList.toggle('open', open);
            heading.setAttribute('aria-expanded', open ? 'true' : 'false');
          }
          setState(!startsCollapsed);
          heading.addEventListener('click', function () { setState(!el.classList.contains('open')); });
          heading.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setState(!el.classList.contains('open')); }
          });
        });
      });
    }

    // Toggle tema chiaro/scuro, persistito in localStorage (key: dev-notes-theme).
    function themeTogglePlugin(hook) {
      hook.mounted(function () {
        var KEY = 'dev-notes-theme';
        var btn = document.createElement('button');
        btn.id = 'theme-toggle';
        btn.type = 'button';
        btn.setAttribute('aria-label', 'Cambia tema chiaro/scuro');
        var saved = localStorage.getItem(KEY);
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        function apply() {
          document.documentElement.classList.toggle('dark', dark);
          btn.textContent = dark ? '☀' : '☾';
          btn.title = dark ? 'Passa al tema chiaro' : 'Passa al tema scuro';
          if (window.mermaid && window.__mermaidInit) {
            mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral' });
          }
        }
        apply();
        btn.addEventListener('click', function () {
          dark = !dark;
          localStorage.setItem(KEY, dark ? 'dark' : 'light');
          apply();
        });
        document.body.appendChild(btn);
      });
    }
    // «▶ Prova»: sotto a ogni blocco di codice CSS aggiunge un bottone che apre il
    // playground precompilato con quello snippet (l'editor è in assets/playground.js).
    function playgroundTryPlugin(hook) {
      hook.doneEach(function () {
        var blocks = document.querySelectorAll('.markdown-section pre[data-lang]');
        Array.prototype.forEach.call(blocks, function (pre) {
          var next = pre.nextElementSibling;
          if (next && next.classList.contains('pg-try')) return;
          if ((pre.getAttribute('data-lang') || '').toLowerCase() !== 'css') return;
          var code = pre.querySelector('code');
          if (!code) return;
          var css = code.textContent.replace(/\n+$/, '');
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'pg-try';
          btn.textContent = '▶ Prova nel playground';
          btn.addEventListener('click', function () {
            if (window.__pgOpen) window.__pgOpen(css);
          });
          pre.insertAdjacentElement('afterend', btn);
        });
      });
    }

    // Imposta il tema il prima possibile per evitare il flash (prima ancora di docsify).
    (function () {
      try {
        var saved = localStorage.getItem('dev-notes-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    })();

    window.$docsify = {
      name: 'Appunti CSS',
      nameLink: '#/',
      loadSidebar: true,
      coverpage: true,
      onlyCover: false,
      homepage: 'README.md',
      notFoundPage: true,
      subMaxLevel: 2,
      relativePath: true,
      auto2top: true,
      // un solo _sidebar.md (root) anche nella sottocartella docs/
      alias: {
        '/docs/_sidebar.md': '/_sidebar.md',
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      // i blocchi ```mermaid diventano <div class="mermaid">, gli altri mantengono l'highlight Prism
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === 'mermaid') {
              return '<div class="mermaid">' + code + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      // callout Obsidian: [!info] [!tip] [!warning] [!note] [!success]  (corpo markdown preservato)
      'flexible-alerts': {
        style: 'callout',
        note:    { label: 'Nota' },
        tip:     { label: 'Suggerimento' },
        warning: { label: 'Attenzione' },
        info:    { label: 'Info', className: 'note', icon: 'icon-note' },
        success: { label: 'Risposta', className: 'callout-answer', icon: 'icon-success' }
      },
      pagination: {
        previousText: 'Precedente',
        nextText: 'Successivo',
        crossChapter: true,
        crossChapterText: true
      },
      search: { placeholder: 'Cerca…', noData: 'Nessun risultato', depth: 4 },
      copyCode: { buttonText: 'Copia', successText: 'Copiato' },
      plugins: [wikilinkPlugin, mermaidPlugin, collapsibleAnswersPlugin, themeTogglePlugin, playgroundTryPlugin]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-css.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-scss.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markup.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>

  <!-- Playground CSS — editor Monaco + anteprima live (vedi assets/playground.js) -->
  <script src="assets/playground.js"></script>
</body>
</html>
